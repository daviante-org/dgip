[package]
name = "dgip"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "Self-hosted 4-layer IPv4 & IPv6 network, geolocation, RPKI & security intelligence engine by Daviante."
license = "Apache-2.0"
authors = ["Daviante <code@daviante.org>"]
homepage = "https://daviante.org"
repository = "https://github.com/daviante-org/dgip"

[lib]
name = "dgip"
path = "src/lib.rs"

[[bin]]
name = "dgip"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["http1", "http2", "json"] }
bytes = "1.9"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
deadpool-postgres = "0.14"
dotenvy = "0.15"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
once_cell = "1.20"
postgres-types = { version = "0.2", features = ["with-chrono-0_4", "with-serde_json-1"] }
rand = "0.8"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde-saphyr = "2.0"
sha2 = "0.10"
tar = "0.4"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-postgres-rustls = "0.13"
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
webpki-roots = "0.26"

[dev-dependencies]
maxminddb = { version = "0.32", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
