# ==============================================================================
# DGIP — Standalone Kubernetes Deployment Manifest
# ==============================================================================
# Usage:
#   1. Replace placeholder secrets in the `dgip-secrets` Secret below.
#   2. Apply with:
#        kubectl apply -f deploy/kubernetes/dgip.yaml
#
# For parameterized deployments, use the official OCI Helm chart on GitHub:
#   helm install dgip oci://ghcr.io/daviante-org/charts/dgip -n dgip --create-namespace
# ==============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: dgip
  labels:
    app.kubernetes.io/part-of: dgip
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dgip
  namespace: dgip
  labels:
    app.kubernetes.io/name: dgip
automountServiceAccountToken: false
---
# Replace placeholder credentials before applying to production clusters.
apiVersion: v1
kind: Secret
metadata:
  name: dgip-secrets
  namespace: dgip
  labels:
    app.kubernetes.io/name: dgip
type: Opaque
stringData:
  postgres-password: "replace-with-strong-postgres-password"
  database-url: "postgresql://dgip:replace-with-strong-postgres-password@dgip-postgresql:5432/dgip"
---
apiVersion: v1
kind: Service
metadata:
  name: dgip-postgresql
  namespace: dgip
  labels:
    app.kubernetes.io/name: dgip
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
  selector:
    app.kubernetes.io/name: dgip
    app.kubernetes.io/component: postgresql
---
# Single-node PostgreSQL 17 StatefulSet storing GiST range indexes & catalog tables.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dgip-postgresql
  namespace: dgip
  labels:
    app.kubernetes.io/name: dgip
    app.kubernetes.io/component: postgresql
spec:
  serviceName: dgip-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dgip
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dgip
        app.kubernetes.io/component: postgresql
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: docker.io/library/postgres:18.6-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "dgip"
            - name: POSTGRES_DB
              value: "dgip"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dgip-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U dgip -d dgip"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U dgip -d dgip"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run-postgresql
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run-postgresql
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# Hardened Stateless DGIP API Deployment (2 replicas coordinated via PG advisory lock).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dgip
  namespace: dgip
  labels:
    app.kubernetes.io/name: dgip
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dgip
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dgip
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: dgip
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dgip
          image: ghcr.io/daviante-org/dgip:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: DGIP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dgip-secrets
                  key: database-url
            # Toggle Daviante-branded Swagger UI (/docs) and /openapi.json (`"true"` or `"false"`)
            - name: DGIP_SWAGGER_ENABLED
              value: "true"
            - name: DGIP_CACHE_DIR
              value: "/tmp/dgip-cache"
          startupProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dgip
  namespace: dgip
  labels:
    app.kubernetes.io/name: dgip
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8090
      targetPort: http
  selector:
    app.kubernetes.io/name: dgip
    app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dgip
  namespace: dgip
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dgip
      app.kubernetes.io/component: api
