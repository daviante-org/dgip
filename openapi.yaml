  /v1/ip/{ip}:
    get:
      tags:
      - IP Lookup
      summary: Lookup 4-layer intelligence for a single IPv4 or IPv6 address
      description: Queries PostgreSQL GiST `int8range` / `numrange` tables across ASN + RPKI ROV, RIR
        + RFC 8805 Geofeed geolocation, and cloud/CDN/privacy-relay/Tor/threat layers. IPv4-mapped IPv6
        literals (`::ffff:3.6.0.1`) are automatically unwrapped.
      operationId: lookup_single_ip_v1_ip__ip__get
      parameters:
      - name: ip
        in: path
        required: true
        schema:
          type: string
          description: IPv4 or IPv6 address literal (no CIDR prefix length or hostname).
          title: Ip
        description: IPv4 or IPv6 address literal (no CIDR prefix length or hostname).
        examples:
          aws_mumbai_ipv4:
            summary: AWS ap-south-1 Mumbai IPv4 (Geofeed + RPKI Valid)
            value: 3.6.0.1
          cloudflare_dns_ipv6:
            summary: Cloudflare Anycast CDN IPv6
            value: 2606:4700:4700::1111
          icloud_relay_ipv4:
            summary: Cloudflare / Apple iCloud Relay range IPv4
            value: 104.28.28.0
          rfc1918_bogon:
            summary: RFC 1918 Private IPv4 (Bogon)
            value: 192.168.1.1
