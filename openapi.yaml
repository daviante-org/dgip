          default: false
          examples:
          - false
        is_bogon:
          type: boolean
          title: Is Bogon
          description: True when the IP falls within an RFC 6890 / IANA special-purpose (non-globally-routable)
            range.
          examples:
          - false
        bogon_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Bogon Type
          description: RFC 6890 special-range category (`private`, `loopback`, `link_local`, `cgnat`,
            `documentation`, `multicast`, `reserved`) when `is_bogon=true`.
          examples:
          - null
        found:
          type: boolean
          title: Found
          description: True when at least one intelligence layer (`asn`, `geo`, or `security`) matched
            the public IP.
          examples:
          - true
        asn:
          anyOf:
          - $ref: '#/components/schemas/ASNInfo'
          - type: 'null'
          description: Layer 1 + Layer 3 BGP Autonomous System and RPKI ROV metadata (`null` if unannounced
            or bogon).
        geo:
          anyOf:
          - $ref: '#/components/schemas/GeoInfo'
          - type: 'null'
          description: Layer 1 + Layer 2 country, continent, and sub-national geofeed metadata (`null`
            if unallocated or bogon).
        security:
          anyOf:
          - $ref: '#/components/schemas/SecurityInfo'
          - type: 'null'
          description: Layer 4 cloud, CDN, privacy-relay, Tor exit, and threat classification (`null`
            when `found=false`).
        snapshot_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Snapshot Version
          description: Active dataset snapshot version tag.
          examples:
          - v2026.W45.1
        live_updated_at:
          anyOf:
          - type: string
