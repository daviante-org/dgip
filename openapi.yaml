openapi: 3.1.0
info:
  title: DGIP Network Intelligence API
  summary: Self-hosted 4-Layer IPv4 & IPv6 Network, Geolocation, RPKI & Security Intelligence API by Daviante
  description: Self-hosted 4-layer IP intelligence API (ASN, RPKI route validation, RFC 8805 sub-national
    geolocation, cloud/CDN/Tor/privacy-relay/threat classification) compiled directly from official RIRs,
    RIPE RIS, RPKI VRPs, provider geofeeds, and open security feeds.
  version: 1.0.0
  termsOfService: https://github.com/daviante-org/dgip-data/blob/main/docs/TERMS.md
  contact:
    name: Daviante
    url: https://daviante.org
    email: code@daviante.org
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  x-logo:
    url: /docs/assets/logo.svg
    altText: dgip by Daviante
paths:
  /healthz/live:
    get:
      tags:
      - Health
      summary: Process liveness probe
      description: Lightweight in-process check confirming the ASGI HTTP server is running.
      operationId: health_live_healthz_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLiveResponse'
  /healthz/ready:
    get:
      tags:
      - Health
      summary: PostgreSQL and active lookup slot readiness probe
      description: Verifies PostgreSQL connectivity and confirms that an active Blue/Green GiST lookup
        slot (`a` or `b`) is populated and ready to serve sub-millisecond queries.
      operationId: health_ready_healthz_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyResponse'
        '503':
          description: PostgreSQL unreachable or initial IP lookup slot still loading.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Dataset Not Ready
                status: 503
                detail: Initial IP lookup slot is still loading.
                instance: /healthz/ready
  /v1/ip/me:
    get:
      tags:
      - IP Lookup
      summary: Inspect caller's own IPv4 or IPv6 intelligence
      description: Resolves 4-layer ASN, RPKI ROV status, RFC 8805 sub-national geolocation, and cloud/CDN/Tor/threat
        intelligence for the connecting client IP (honoring `X-Forwarded-For` right-to-left only across
        configured `trusted_proxies`).
      operationId: lookup_caller_ip_v1_ip_me_get
      responses:
        '200':
          description: 4-layer IP intelligence for the connecting caller.
          headers:
            X-RateLimit-Limit:
              description: Maximum requests permitted per 60-second sliding window.
              schema:
                type: integer
                example: 120
            X-RateLimit-Remaining:
              description: Remaining requests allowed in the current 60-second window.
              schema:
                type: integer
                example: 119
            X-RateLimit-Reset:
              description: Seconds until the sliding rate-limit window resets.
              schema:
                type: integer
                example: 42
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPLookupResponse'
              examples:
                aws_mumbai_geofeed:
                  summary: AWS ap-south-1 IPv4 (RFC 8805 Geofeed + RPKI Valid + Cloud)
                  description: Globally routable IPv4 resolved to Mumbai, India via AWS physical geofeed
                    with RPKI valid AS16509.
                  value:
                    ip: 3.6.0.1
                    ip_version: 4
                    is_ipv4_mapped: false
                    is_bogon: false
                    bogon_type: null
                    found: true
                    asn:
                      number: 16509
                      code: AS16509
                      organization: Amazon.com, Inc.
                      network_type: hosting
                      rpki_status: valid
                      range_start: 3.6.0.0
                      range_end: 3.7.255.255
                    geo:
                      country_code: IN
                      country_name: India
                      continent_code: AS
                      continent_name: Asia
                      region_code: IN-MH
                      city: Mumbai
                      source: geofeed
                      range_start: 3.6.0.0
                      range_end: 3.7.255.255
                    security:
                      is_cloud: true
                      is_datacenter: true
                      is_cdn: false
                      is_tor_exit: false
                      is_privacy_relay: false
                      is_threat: false
                      provider: aws
                      threat_feeds: []
                      range_start: 3.6.0.0
                      range_end: 3.7.255.255
                    snapshot_version: v2026.W45.1
                    live_updated_at: '2026-11-02T19:00:00Z'
