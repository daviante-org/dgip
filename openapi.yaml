    IPLookupResponse:
      properties:
        ip:
          type: string
          title: Ip
          description: Canonical normalized IPv4 or compressed RFC 5952 IPv6 address.
          examples:
          - 3.6.0.1
        ip_version:
          anyOf:
          - type: integer
            enum:
            - 4
            - 6
          - type: integer
          title: Ip Version
          description: Normalized IP protocol version (`4` or `6`). `::ffff:a.b.c.d` unwraps to `4` with
            `is_ipv4_mapped=true`.
