components:
  schemas:
    ASNInfo:
      properties:
        number:
          type: integer
          title: Number
          description: 32-bit Autonomous System Number (RFC 6793).
          examples:
          - 16509
        code:
          type: string
          title: Code
          description: Formatted `AS<number>` identifier.
          examples:
          - AS16509
        organization:
          anyOf:
          - type: string
          - type: 'null'
          title: Organization
          description: Registered Autonomous System organization name from RIR/WHOIS.
          examples:
          - Amazon.com, Inc.
        network_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Network Type
          description: Classified network role (`isp`, `hosting`, `cdn`, `transit`, `content`, `education`,
            `government`, `business`), or `null` when unclassified.
          examples:
          - hosting
        rpki_status:
          anyOf:
          - type: string
            enum:
            - valid
            - invalid
            - unknown
          - type: string
          - type: 'null'
          title: Rpki Status
          description: Cryptographic RPKI Route Origin Validation state (`valid`, `invalid`, or `unknown`
            when no ROA covers the prefix).
          default: unknown
          examples:
          - valid
        range_start:
          type: string
          title: Range Start
          description: First IP address of the coalesced routed BGP interval.
          examples:
          - 3.6.0.0
        range_end:
          type: string
          title: Range End
          description: Last IP address of the coalesced routed BGP interval.
          examples:
          - 3.7.255.255
      type: object
      required:
      - number
      - code
      - range_start
      - range_end
      title: ASNInfo
      description: Autonomous System ownership, network classification, RPKI status, and BGP prefix range.
      example:
        code: AS16509
        network_type: hosting
        number: 16509
        organization: Amazon.com, Inc.
        range_end: 3.7.255.255
        range_start: 3.6.0.0
        rpki_status: valid
    BatchIPItemResult:
      properties:
        input:
          type: string
          title: Input
          description: Original string supplied at this position in `ips`.
          examples:
          - 3.6.0.1
        ok:
          type: boolean
          title: Ok
          description: True if `input` parsed as a valid IPv4/IPv6 literal; false if malformed.
          examples:
          - true
        data:
          anyOf:
          - $ref: '#/components/schemas/IPLookupResponse'
          - type: 'null'
          description: Full 4-layer lookup result when `ok=true`.
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Parse error reason when `ok=false`.
          examples:
          - null
      type: object
      required:
      - input
      - ok
      title: BatchIPItemResult
      description: Per-item result within a bulk IP lookup response, preserving caller input order.
      example:
        data:
          asn:
            code: AS16509
            network_type: hosting
            number: 16509
            organization: Amazon.com, Inc.
            range_end: 3.7.255.255
            range_start: 3.6.0.0
            rpki_status: valid
          found: true
          geo:
            city: Mumbai
            continent_code: AS
            continent_name: Asia
            country_code: IN
            country_name: India
            range_end: 3.7.255.255
            range_start: 3.6.0.0
            region_code: IN-MH
            source: geofeed
          ip: 3.6.0.1
          ip_version: 4
          is_bogon: false
          is_ipv4_mapped: false
          live_updated_at: '2026-11-02T19:00:00Z'
          security:
            is_cdn: false
            is_cloud: true
            is_datacenter: true
            is_privacy_relay: false
            is_threat: false
            is_tor_exit: false
            provider: aws
            range_end: 3.7.255.255
            range_start: 3.6.0.0
            threat_feeds: []
          snapshot_version: v2026.W45.1
        input: 3.6.0.1
        ok: true
    BatchIPRequest:
      properties:
        ips:
          items:
            type: string
          type: array
          maxItems: 1000
          minItems: 1
          title: Ips
          description: Ordered list of 1–1,000 IPv4 or IPv6 literals. Invalid items do not fail the HTTP
            batch; instead they return `ok=false` with an item-level `error` message at the same index.
          examples:
          - - 3.6.0.1
            - 2606:4700:4700::1111
            - 192.168.1.1
            - not-an-ip
      type: object
      required:
      - ips
      title: BatchIPRequest
      description: Bulk IPv4 and IPv6 lookup request payload (1 to `batch_max_ips` addresses, default
        1,000).
      example:
        ips:
        - 3.6.0.1
        - 2606:4700:4700::1111
        - 192.168.1.1
        - not-an-ip
    BatchIPResponse:
      properties:
        count:
          type: integer
          title: Count
