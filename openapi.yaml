  /v1/ip/batch:
    post:
      tags:
      - IP Lookup
      summary: Bulk lookup up to 1,000 IPv4 and IPv6 addresses in one query
      description: Deduplicates unique IPv4 and IPv6 targets in memory, executes a single lateral GiST
        query per address family, and returns results in exact caller order. Malformed entries return
        `ok=false` with a per-item `error` rather than failing the whole batch.
      operationId: lookup_batch_ips_v1_ip_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchIPRequest'
              description: JSON object containing 1–1,000 IPv4/IPv6 address strings.
            examples:
              mixed_dual_stack:
                summary: Mixed IPv4, IPv6, Bogon & Invalid Input
                description: Demonstrates dual-stack lookup, bogon classification, and non-fatal per-item
                  error reporting.
                value:
                  ips:
                  - 3.6.0.1
                  - 2606:4700:4700::1111
                  - 192.168.1.1
                  - not-an-ip
              public_resolvers:
                summary: Public Anycast DNS Resolvers (IPv4 & IPv6)
                value:
                  ips:
                  - 1.1.1.1
                  - 8.8.8.8
                  - 9.9.9.9
                  - 2001:4860:4860::8888
        required: true
      responses:
        '200':
          description: Ordered bulk IP intelligence results.
          headers:
            X-RateLimit-Limit:
              description: Maximum requests permitted per 60-second sliding window.
              schema:
                type: integer
                example: 120
            X-RateLimit-Remaining:
              description: Remaining requests allowed in the current 60-second window.
              schema:
                type: integer
                example: 119
            X-RateLimit-Reset:
              description: Seconds until the sliding rate-limit window resets.
              schema:
                type: integer
                example: 42
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchIPResponse'
        '400':
          description: Configured `batch_max_ips` runtime limit exceeded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Batch Size Exceeded
                status: 400
                detail: Maximum batch size is 1000 IP addresses.
                instance: /v1/ip/batch
        '413':
          description: Streaming HTTP request body exceeded `max_request_body_bytes` (default 256 KiB).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Payload Too Large
                status: 413
                detail: Request body exceeds maximum allowed size of 262144 bytes.
                instance: /v1/ip/batch
        '422':
          description: Malformed JSON body or empty `ips` array.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unprocessable Content
                status: 422
                detail: '[{''type'': ''too_short'', ''loc'': (''body'', ''ips''), ''msg'': ''List should
                  have at least 1 item after validation, not 0''}]'
                instance: /v1/ip/batch
        '429':
          description: Sliding-window per-client IP rate limit exceeded.
          headers:
            X-RateLimit-Limit:
              description: Maximum requests permitted per 60-second sliding window.
              schema:
                type: integer
                example: 120
            X-RateLimit-Remaining:
              description: Remaining requests allowed in the current window.
              schema:
                type: integer
                example: 0
            X-RateLimit-Reset:
              description: Seconds until the sliding rate-limit window resets.
              schema:
                type: integer
                example: 18
            Retry-After:
              description: Seconds to wait before retrying the request.
              schema:
                type: integer
                example: 18
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: Rate limit exceeded. Retry after the indicated window.
                instance: /v1/ip/batch
        '503':
          description: IP lookup tables are still initializing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Dataset Not Ready
                status: 503
                detail: IP lookup tables are still initializing.
                instance: /v1/ip/batch
  /v1/snapshots:
    get:
      tags:
      - Snapshots
      summary: List dataset snapshot releases
      description: Returns compiled dataset snapshot history ordered newest first, including active slot
        version, blob retention policy (`has_blobs`), row counts, and SHA-256 digests.
      operationId: list_snapshots_v1_snapshots_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of recent snapshot releases to return (`1`–`100`).
          default: 20
          title: Limit
        description: Maximum number of recent snapshot releases to return (`1`–`100`).
        examples:
          default_page:
            summary: Default (20 releases)
            value: 20
          retained_only:
            summary: Top 5 retained releases
            value: 5
      responses:
        '200':
          description: Paginated dataset snapshot release list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotListResponse'
          headers:
            X-RateLimit-Limit:
              description: Maximum requests permitted per 60-second sliding window.
              schema:
                type: integer
                example: 120
            X-RateLimit-Remaining:
              description: Remaining requests allowed in the current 60-second window.
              schema:
                type: integer
                example: 119
            X-RateLimit-Reset:
              description: Seconds until the sliding rate-limit window resets.
              schema:
                type: integer
                example: 42
        '422':
          description: Query parameter `limit` outside `1..100`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unprocessable Content
                status: 422
                detail: '[{''type'': ''less_than_equal'', ''loc'': (''query'', ''limit''), ''msg'': ''Input
                  should be less than or equal to 100''}]'
                instance: /v1/snapshots
        '429':
          description: Sliding-window per-client IP rate limit exceeded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: Rate limit exceeded. Retry after the indicated window.
                instance: /v1/snapshots
          headers:
            X-RateLimit-Limit:
              description: Maximum requests permitted per 60-second sliding window.
              schema:
                type: integer
                example: 120
            X-RateLimit-Remaining:
              description: Remaining requests allowed in the current window.
              schema:
                type: integer
                example: 0
            X-RateLimit-Reset:
              description: Seconds until the sliding rate-limit window resets.
              schema:
                type: integer
                example: 18
            Retry-After:
              description: Seconds to wait before retrying the request.
              schema:
                type: integer
                example: 18
  /v1/snapshots/latest:
    get:
      tags:
      - Snapshots
      summary: Get latest dataset snapshot metadata and update check
      description: Returns metadata, checksums, row counts, and release notes for the newest compiled
        dataset snapshot. Pass `?current_version=<tag>` to compute `update_available`.
      operationId: get_latest_snapshot_v1_snapshots_latest_get
      parameters:
      - name: current_version
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
