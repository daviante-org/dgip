{{- if .Values.serviceAccount.create -}}
# Dedicated ServiceAccount with API token automount disabled by default
# to minimize in-cluster attack surface.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dgip.serviceAccountName" . }}
  labels:
    {{- include "dgip.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
