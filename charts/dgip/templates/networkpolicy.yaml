{{- if .Values.networkPolicy.enabled -}}
# Optional NetworkPolicy restricting inbound TCP traffic to the DGIP HTTP port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dgip.fullname" . }}
  labels:
    {{- include "dgip.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dgip.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if .Values.networkPolicy.allowAllIngress }}
  ingress:
    - ports:
        - protocol: TCP
          port: 8090
  {{- end }}
{{- end }}
